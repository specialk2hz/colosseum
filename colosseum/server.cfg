// server.cfg -- Colosseum's shared defaults.
//
// NOT `default.cfg`, and the reason is worth stating because the spec asked for that
// name.  `default.cfg` is ID'S OWN FILE: it ships inside `pak0.pak` and holds
// all 68 key bindings a Quake II client starts with.  q2pro execs
// `default.cfg` from the gamedir before `config.cfg`, and a real file in the
// gamedir wins over a pak entry -- so a file of ours by that name means a
// client that joins with `+set game colosseum` gets **zero bindings**: no
// movement, no fire, no menu key.
//
// It cost nothing on a dedicated server, which is why every check in this
// repository passed with it: a server has no bindings to lose.  It was found
// the first time a person ran `tools/watch.sh` on a display.
//
// Every value below is what the library already defaults to.  It is written
// down so an operator can see the whole surface in one place and change it
// without reading the source; on a fresh server deleting a line changes
// nothing.
//
// What a line here DOES change is the command line.  Q2PRO applies every
// `+set` on it before any `+exec`, whatever the order the arguments are in, so
// a value this file sets undoes the same `+set` on the launch line.  The ones
// an operator chooses per launch -- the ruleset, the two content layers, the
// modifiers and `bots` -- are therefore written below as comments, not set:
// `+set rogue 1 +exec configs/tdm.cfg` then does what it says.  To change one
// of the others from the command line, edit it here instead.
//
// The per-ruleset files in configs/ set only what their ruleset needs and
// assume this one has been exec'd first.

// ---------------------------------------------------------------- the venue
// The ruleset is LATCHED: it takes effect at the next map load.  Seven names:
//
//   dm      free-for-all deathmatch, OSP's RegularDM
//   dmpro   the same behind a ready gate, with qualifying places
//   tdm     two teams -- captains, join codes, lock, overtime
//   duel    1v1, two teams of one forced, with a spectator queue
//   ctf     Threewave capture the flag
//   arena   Rocket Arena 2, up to 32 games on one map
//   sp      single player and co-op
//
// The first four are OSP Tourney DM's four modes of play, which `match_mode`
// used to select between.  `g_ruleset tourney` and `match_mode` are
// both gone -- `tourney` is not a ruleset name any more, so a config still
// naming it gets the same warning any other unrecognised value gets and runs
// as `dm`.
//
// An unrecognised name warns once and falls back to dm rather than
// refusing to start.  No name at all is dm too, unless a legacy alias --
// `ctf 1`, `rocketarena 1` -- or `coop 1` chooses.  Each file in configs/ sets
// its own ruleset after exec'ing this one.
// set g_ruleset dm

// Content layers, both latched.  These are the mission packs' entity and
// weapon content, and they compose with any ruleset.
// set xatrix 0
// set rogue 0

// Modifiers.  Each is a request; the ruleset decides whether it is accepted,
// and `sv ruleset` reports what is actually in force.
// set runes 0
// `teamplay` is refused by every ruleset, and each says so: team play is `tdm`
// and `duel` under the four OSP rulesets -- one selector, not two -- and `ctf`
// and `arena` decide their own teams.
// set teamplay 0
// set hook 0

// ---------------------------------------------------------------- the bots
// `bots` IS the switch: 1 where the ruleset accepts them, and the bot layer
// costs a bot-free server nothing when it is 0.
// set bots 1
// The roster.  Relative to the gamedir, and it is found inside a pak just as
// readily as on disk.
set botfile "botcfg/bots.cfg"
// The commands that manage bots -- addbot, addrandom, removebot, becomebot,
// botpause -- are server-only by default, and the bot menu wants the rcon
// password.  The 1999 default of 0 exposed the bot-name copies to any client;
// leave this at 1.
set serveronlybotcmds 1
// How many players the server keeps in the game by adding bots.  0 is off.
// Under the four OSP rulesets the name is `bots_minplayers` instead, which is
// tourney's own, defaults to 4 and runs only with `bots_autoload` 2, 3 or 4;
// their four configs set both.
set minimumplayers 0
// ...or let the GAME say how many, which is one switch for every ruleset:
// the arena's declared size under `arena`, the map's spawn pools under `dm`,
// `dmpro` and `ctf`, two full teams under `tdm` (`2 * team_maxplayers`) and 2
// under `duel`, whose teams are one player each.
// `sv ruleset` prints the target in force.
set botfill 0
// Every bot's name is shown behind this tag -- "[BOT]Sarge" -- so nobody takes
// a bot for a person.  The game adds it: bots.cfg and the character files keep
// the bots' own names, and `removebot` takes either.  The tag and the name
// share the fifteen characters a name has, so a long name loses its end.  ""
// is no tag.  A person's name loses the tag from its front, so only a bot can
// wear it.
set botnametag "[BOT]"
// On Windows, a map with no .aas makes the brain start `winbspc.exe` from the
// gamedir to build one; every other build only says BSPC is a Win32 program.
// Off: launching an external tool from a game library is the one exception
// the bot layer carries, and it stays closed unless asked for.  To ask, change
// it HERE -- a `+set autolaunchbspc 1` on the command line is undone by this
// line, like any other value this file sets.
set autolaunchbspc 0

// ---------------------------------------------------------------- the extras
// The seven features the 1999 module carried behind #defines.
// A filename opens the game log; "" leaves it closed.
set g_gamelog ""
// Client lag simulation.  Off, because `lag` is a client command and a player
// who can ask the server to hold two seconds of their input is asking it for
// memory.
set g_clientlag 0
// The two 1999 trigger entities, and the rotating button.  All latched,
// because all three decide what a map spawns.
set g_triggercounting 0
set g_triggerlog 0
set g_rotatingbutton 0
// The Gladiator observer, for ctf and sp.  arena and the four OSP rulesets have
// their own and this does not reach them.
set g_observer 1

// ---------------------------------------------------------------- hygiene
// Flood protection is the server's, it expires, and it is configurable --
// which is why RA2's own session-long spam counter is not also in force.
set flood_msgs 4
set flood_persecond 4
set flood_waitdelay 10
// `netlog` named a remote host RA2 forwarded its event log to over UDP.  There
// is no forwarding any more; the name still resolves so an old
// config parses, and `logfile 2` writes the same lines locally.
set netlog ""

// ---------------------------------------------------------------- instagib fork
// IG: the fork's switches, at their upstream defaults.  Every mode config execs
// this file first, so a Config vote away from instagib.cfg turns them back off
// (IG-SPECS.md).
// Grouped as the server repo turns them on (its groups/*.cfg): A hook
// movement, B instagib combat, C map movement (every mode), D roaming, M menus.
set ig_noblaster 0          // instagib loadout
set ig_bothook 0            // A
set ig_botsling 0           // A
set ig_botpadhook 0         // A
set ig_botpullhop 0         // A
set ig_botstairhook 0       // A
set ig_botaffinity 0        // A
set ig_botfighthook 0       // B
set ig_botrevenge 0         // B
set ig_nofallfx 0           // B
set ig_lavarescue 0         // B
set ig_railsplash 0         // B
set ig_botarcsafe 0         // B
set ig_botplan 0            // B, the movement layer: the planner and IG-28, 31, 32, 35, 36, 38, 42 folded in (ig-0.5)
set ig_botnav 0             // B, the map-knowledge layer: IG-43, 44, 46 folded in (ig-0.5)
set ig_botfastjumps 0       // B, trial: momentum jumps, with ig_botnav (IG-47)
set ig_botroutemomentum 0   // B, routes price straight lines at hop speed (IG-46)
set ig_botstrafehack 1      // C, on in every mode: bots land like Q2PRO clients (IG-14)
set ig_botwalkway 0         // C
set ig_botunstuck 0         // C
set ig_botroam 0            // D
set ig_scoremap 0           // M
set ig_votemaplist 0        // M
set ig_endvote 0            // M
set ig_menufast 0           // M
set ig_chasespeed 0         // M, a speedometer under the chase line (IG-41)
set hook_type "osp"         // hook style (IG-34): a Config vote goes back to OSP's
set ig_hookvote ""          // hook styles the vote offers; "" = on/off only
// testing aids
set ig_moverec 0
set ig_botpeace 0
set ig_botroutes 0
set ig_botdebug 0
set ig_movedebug 0
set ig_drill 0
// ...and what instagib.cfg changes that upstream's mode configs do not set,
// back at the library's defaults (engine default for dmflags).  A `+set` of
// one of these on the launch line is undone here, as for the rest of this file.
set dmflags 16
set weapon_have 0
set weapon_initial 0
set start_slugs 0
set max_slugs 50
set damage_railgun 100
set motd_file "motd.txt"
set allow_id 1
set allow_shotgun 1
set allow_supershotgun 1
set allow_machinegun 1
set allow_chaingun 1
set allow_grenadelauncher 1
set allow_rocketlauncher 1
set allow_hyperblaster 1
set allow_railgun 1
set allow_bfg 1
set allow_ammo_cells 1
set allow_ammo_grenades 1
set allow_item_powerscreen 1
set allow_item_powershield 1
set allow_item_quad 1
set allow_item_invul 1
set allow_item_pack 1
set allow_ionripper 1
set allow_phalanx 1
set allow_ammo_trap 1
set allow_etfrifle 1
set allow_proxlauncher 1
set allow_plasmabeam 1
set allow_chainfist 1
set allow_disruptor 1
set allow_ammo_tesla 1
set allow_item_nuke 1
// No bot chat, in every mode (a server choice, not a default: upstream leaves
// it unset, which is chat on).  Reaches the bot library when it loads, which
// is every map.  `set nochat 0` in a mode config after this file turns it back on.
set nochat 1
